<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pottery Smash 3D Ultra - リアル植木鉢投擲・粉砕シミュレーター (VR対応)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (3D Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #08090c;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* Glass UI effect */
    .glass-card {
      background: rgba(14, 18, 27, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    
    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35);
    }

    .glass-btn:active {
      transform: scale(0.95);
    }

    /* Dramatic Speed Lines during heavy throw */
    #speed-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      background: radial-gradient(circle, transparent 40%, rgba(255, 120, 30, 0.18) 85%, rgba(255, 60, 0, 0.4) 100%);
      mix-blend-mode: screen;
    }

    .speed-lines {
      background-image: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.18) 0deg 2deg, transparent 2deg 12deg);
      mask-image: radial-gradient(circle, transparent 45%, black 80%);
      -webkit-mask-image: radial-gradient(circle, transparent 45%, black 80%);
    }

    /* Slingshot Pull Vector line */
    #trajectory-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    /* Target Reticle Pulsing */
    @keyframes rippleAnim {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }
    .tap-ripple {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 3px solid #fb923c;
      border-radius: 50%;
      pointer-events: none;
      animation: rippleAnim 0.45s ease-out forwards;
      z-index: 25;
    }

    /* Impact flash */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s ease-out;
      z-index: 30;
    }

    /* Dynamic Tower Crash text popup */
    @keyframes crashPopupAnim {
      0% { transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.25) rotate(4deg); opacity: 1; }
      40% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1.05) rotate(-2deg); opacity: 0.9; }
      100% { transform: translate(-50%, -85%) scale(1.3) rotate(0deg); opacity: 0; }
    }
    .crash-popup {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 35;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: crashPopupAnim 0.85s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      text-shadow: 0 0 24px rgba(249, 115, 22, 0.85), 0 4px 14px rgba(0, 0, 0, 0.95);
    }

    /* Horizontal & Vertical scrollbar hidden */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Shotgun Mode active glow */
    .shotgun-active {
      background: linear-gradient(135deg, #a855f7, #ec4899) !important;
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.7) !important;
      border-color: rgba(255, 255, 255, 0.8) !important;
    }

    /* VR Button Adjustment */
    #VRButton {
      z-index: 50 !important;
      background: rgba(249, 115, 22, 0.9) !important;
      border: none !important;
      border-radius: 12px !important;
      font-weight: bold !important;
    }
  </style>
</head>
<body class="relative w-full h-full text-slate-100">

  <!-- 3D WebGL Canvas Layer -->
  <div id="canvas-container"></div>

  <!-- Fullscreen Visual Feedback Overlays -->
  <div id="speed-overlay" class="speed-lines z-10"></div>
  <div id="flash-overlay"></div>

  <!-- Trajectory drag guide SVG -->
  <svg id="trajectory-svg" class="w-full h-full">
    <line id="aim-line" x1="0" y1="0" x2="0" y2="0" stroke="rgba(251, 146, 60, 0.85)" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round" />
    <circle id="aim-target" cx="0" cy="0" r="14" fill="rgba(249, 115, 22, 0.3)" stroke="#fb923c" stroke-width="2.5" />
  </svg>

  <!-- 極小ミニマルヘッダー -->
  <div class="absolute top-2 left-2 pointer-events-none z-20 flex items-center space-x-2">
    <div class="glass-card rounded-xl px-2.5 py-1 flex items-center space-x-1.5 pointer-events-auto">
      <div class="w-5 h-5 rounded-md bg-gradient-to-br from-amber-500 to-rose-600 flex items-center justify-center text-white text-xs">
        <i class="fa-solid fa-burst"></i>
      </div>
      <span class="text-[11px] font-black tracking-wide text-white">POTTERY SMASH</span>
      <span class="px-1 py-0.2 rounded text-[9px] font-black bg-indigo-500 text-white">VR READY</span>
    </div>
  </div>

  <!-- テレメトリーステータス -->
  <div class="absolute top-2 right-2 pointer-events-none z-20 flex items-center space-x-1.5">
    <div class="glass-card rounded-xl px-2 py-1 pointer-events-auto flex items-center space-x-1.5 text-[11px]">
      <span class="text-slate-400 font-bold">撃破:</span>
      <span id="stat-smashes" class="font-black text-amber-400">0</span>
    </div>
    <div class="glass-card rounded-xl px-2 py-1 pointer-events-auto flex items-center space-x-1 text-[11px]">
      <span class="text-slate-400 font-bold">球速:</span>
      <span id="stat-speed" class="font-black text-cyan-400">0 <span class="text-[9px]">km/h</span></span>
    </div>
  </div>

  <!-- 👈 左側縦型ドック：植木鉢パレット -->
  <div class="absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none z-20 flex flex-col items-center">
    <div class="glass-card rounded-2xl p-1.5 flex flex-col gap-1.5 pointer-events-auto max-h-[82vh] overflow-y-auto no-scrollbar shadow-2xl" onpointerdown="event.stopPropagation()">
      <div class="text-[9px] font-black text-slate-400 text-center tracking-widest uppercase mb-0.5">鉢素材</div>
      
      <button id="type-terracotta" onclick="setPotType('terracotta')" class="pot-type-btn active w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center bg-gradient-to-r from-orange-600 to-amber-600 text-white shadow-md transition" title="素焼き鉢">
        <i class="fa-solid fa-seedling text-sm"></i>
        <span class="text-[9px] mt-0.5 font-bold">素焼き</span>
      </button>

      <button id="type-glazed" onclick="setPotType('glazed')" class="pot-type-btn w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 transition" title="瑠璃青磁鉢">
        <i class="fa-solid fa-gem text-sm text-cyan-400"></i>
        <span class="text-[9px] mt-0.5">青磁</span>
      </button>

      <button id="type-porcelain" onclick="setPotType('porcelain')" class="pot-type-btn w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 transition" title="白磁鉢">
        <i class="fa-solid fa-leaf text-sm text-emerald-400"></i>
        <span class="text-[9px] mt-0.5">白磁</span>
      </button>

      <button id="type-concrete" onclick="setPotType('concrete')" class="pot-type-btn w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 transition" title="モルタル鉢">
        <i class="fa-solid fa-cube text-sm text-slate-400"></i>
        <span class="text-[9px] mt-0.5">石材</span>
      </button>

      <div class="w-8 h-[1px] bg-white/20 my-0.5 self-center"></div>

      <!-- 💥 特殊ポット（爆弾・水晶・溶岩） -->
      <button id="type-dynamite" onclick="setPotType('dynamite')" class="pot-type-btn w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center text-rose-300 hover:text-white hover:bg-rose-600/30 border border-rose-500/30 transition" title="💣 ダイナマイト鉢 (大爆発)">
        <i class="fa-solid fa-bomb text-sm text-rose-400"></i>
        <span class="text-[9px] mt-0.5 font-bold">爆弾</span>
      </button>

      <button id="type-crystal" onclick="setPotType('crystal')" class="pot-type-btn w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center text-cyan-300 hover:text-white hover:bg-cyan-600/30 border border-cyan-500/30 transition" title="💎 クリスタル鉢 (140破片)">
        <i class="fa-solid fa-wand-magic-sparkles text-sm text-cyan-300"></i>
        <span class="text-[9px] mt-0.5 font-bold">水晶</span>
      </button>

      <button id="type-magma" onclick="setPotType('magma')" class="pot-type-btn w-12 h-11 rounded-xl text-xs font-bold flex flex-col items-center justify-center text-amber-300 hover:text-white hover:bg-amber-600/30 border border-amber-500/30 transition" title="🌋 溶岩鉢 (超重量激震)">
        <i class="fa-solid fa-volcano text-sm text-amber-400"></i>
        <span class="text-[9px] mt-0.5 font-bold">溶岩</span>
      </button>
    </div>
  </div>

  <!-- 👉 右側縦型ドック：ユーティリティ -->
  <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none z-20 flex flex-col items-end gap-2.5">
    <div class="glass-card rounded-2xl p-1.5 flex flex-col gap-1.5 pointer-events-auto shadow-xl" onpointerdown="event.stopPropagation()">
      <button onclick="resetTower()" class="glass-btn w-11 h-10 rounded-xl flex items-center justify-center text-amber-300 hover:bg-amber-500/20" title="ピラミッドタワーを再構築">
        <i class="fa-solid fa-cubes-stacked text-sm"></i>
      </button>
      <button id="cam-toggle-btn" onclick="cycleCameraView()" class="glass-btn w-11 h-10 rounded-xl flex items-center justify-center text-slate-200" title="カメラ視点切替">
        <i class="fa-solid fa-video text-sm text-amber-400"></i>
      </button>
      <button id="slowmo-btn" onclick="toggleSlowMo()" class="glass-btn w-11 h-10 rounded-xl flex items-center justify-center text-slate-200" title="スローモーション">
        <i class="fa-solid fa-gauge-high text-sm text-cyan-400"></i>
      </button>
      <button onclick="respawnReadyPot()" class="glass-btn w-11 h-10 rounded-xl flex items-center justify-center text-slate-200 hover:text-amber-400" title="新しい鉢を構える">
        <i class="fa-solid fa-rotate-left text-sm"></i>
      </button>
      <button onclick="clearRoom()" class="glass-btn w-11 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-rose-400" title="破片と壁の傷を清掃">
        <i class="fa-solid fa-broom text-sm"></i>
      </button>
      <button id="sound-btn" onclick="toggleAudio()" class="glass-btn w-11 h-10 rounded-xl flex items-center justify-center text-amber-400" title="サウンド切り替え">
        <i class="fa-solid fa-volume-high text-sm"></i>
      </button>
    </div>

    <div class="flex flex-col gap-2 pointer-events-auto" onpointerdown="event.stopPropagation()">
      <button id="shotgun-toggle-btn" onclick="toggleShotgunMode()" class="glass-btn w-14 h-12 rounded-2xl flex flex-col items-center justify-center text-slate-200 border border-purple-400/40 hover:text-white shadow-lg" title="3連ショットガン射出">
        <i class="fa-solid fa-burst text-purple-400 text-sm"></i>
        <span id="shotgun-label" class="text-[9px] font-black mt-0.5">3連:OFF</span>
      </button>

      <button onclick="forceThrow(1.5)" class="w-14 h-14 rounded-2xl flex flex-col items-center justify-center text-white bg-gradient-to-tr from-orange-600 via-rose-600 to-amber-500 shadow-xl shadow-orange-600/50 border border-white/20 active:scale-95 transition" title="全力投球">
        <i class="fa-solid fa-meteor text-amber-200 text-base"></i>
        <span class="text-[9px] font-black tracking-tighter mt-0.5">全力投球</span>
      </button>
    </div>
  </div>

  <!-- Throw Guidance / Dynamic Power Reticle -->
  <div id="reticle-hud" class="absolute pointer-events-none z-15 transition-opacity duration-150 opacity-0 flex flex-col items-center">
    <div class="relative w-20 h-20 flex items-center justify-center">
      <div id="power-ring" class="absolute inset-0 rounded-full border-4 border-amber-400/80 border-t-transparent animate-spin"></div>
      <div class="w-5 h-5 rounded-full bg-gradient-to-tr from-orange-500 to-rose-500 shadow-xl shadow-orange-500/80"></div>
    </div>
    <div id="power-gauge" class="mt-1 px-3 py-1 bg-black/80 backdrop-blur-md border border-orange-500/50 rounded-full text-[11px] font-black tracking-widest text-amber-300">
      AIM
    </div>
  </div>

  <!-- First Time User Tutorial / Hint -->
  <div id="guide-modal" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 glass-card rounded-3xl p-5 text-center max-w-xs pointer-events-none z-20 transition-all duration-500 shadow-2xl">
    <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 text-white flex items-center justify-center text-2xl mb-2.5 shadow-lg shadow-orange-500/40 animate-pulse">
      <i class="fa-solid fa-bullseye"></i>
    </div>
    <h2 class="text-base font-black text-white mb-1">直感プレイ対応！</h2>
    <p class="text-[11px] text-slate-300 leading-relaxed mb-3">
      【ブラウザ】壊したい場所を画面タップで発射！<br>
      【VRモード】右手に鉢を持っています。<strong class="text-amber-300">ボールを投げるように腕を振る</strong>と、振り切った瞬間（または手を開いた瞬間）に壁へ飛んでいきます！
    </p>
    <div class="inline-block px-2.5 py-0.5 rounded-full bg-white/10 text-[10px] text-amber-200 font-semibold border border-white/10">
      画面タップで開始
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast-notify" class="absolute bottom-6 left-1/2 -translate-x-1/2 glass-card px-4 py-1.5 rounded-xl text-xs text-amber-300 opacity-0 transition-opacity duration-300 pointer-events-none z-30 font-semibold shadow-xl">
    新しい植木鉢を構えました！
  </div>

  <script>
    let scene, camera, renderer, cameraGroup;
    let readyPot = null;              
    let flyingPots = [];              
    let shards = [];
    let soilParticles = [];
    let rootBallDebris = [];
    let foliagePieces = [];
    let dustClouds = [];
    let potTrails = [];               
    let wallImpactDecals = [];
    let speedLinesActive = false;

    // 特殊ポット & 3連乱射ステート
    let isShotgunMode = false;
    const potTypesList = ['terracotta', 'glazed', 'porcelain', 'concrete', 'dynamite', 'crystal', 'magma'];

    // IMPACT POLISH: Hit-stop & Shockwaves
    let hitStopTimer = 0;             
    let shockwaves = [];              

    // DESTRUCTION TARGET: Collapsible Wooden Crate Pyramid Tower
    let towerBlocks = [];             
    let crateTexture = null;

    // Raycasting & Aiming System
    let raycaster, mouseNorm;
    let wallAimPlane;
    let wallTargetMarker;
    let currentAimTarget = new THREE.Vector3(0, 1.2, -12.5);
    let autoRespawnTimeout = null;

    // VR Controls
    let controller1, controller2;
    let hand1, hand2;
    let raycasterVR;
    let vrUI = [];
    let vrThrowCooldown = 0;
    let vrHandMode = false; // Questの実ハンドトラッキングを優先
    const VR_HAND_POT_SCALE = 0.19;
    const VR_HAND_HOLD_OFFSET = new THREE.Vector3(0, -0.055, -0.115);

    // Simulation timing & scales
    let isSlowMo = false;
    let timeScale = 1.0;
    let audioEnabled = true;
    let audioCtx = null;
    let activePotType = 'terracotta';

    // Camera Modes
    let cameraMode = 0;
    const cameraConfigs = [
      { label: '投擲手 (FPS)', pos: new THREE.Vector3(0, 0.65, 4.2), target: new THREE.Vector3(0, 0.7, -12.5) },
      { label: '斜め上俯瞰', pos: new THREE.Vector3(5.6, 4.0, 3.6), target: new THREE.Vector3(-0.3, 0.0, -5.0) },
      { label: '肩越し (TPS)', pos: new THREE.Vector3(1.7, 1.05, 3.9), target: new THREE.Vector3(-0.15, 0.7, -12.5) },
      { label: '側面広角 (シネマ)', pos: new THREE.Vector3(7.2, 1.5, -2.0), target: new THREE.Vector3(0, 0.2, -6.0) }
    ];
    let baseCameraPos = new THREE.Vector3().copy(cameraConfigs[0].pos);
    let cameraOffset = new THREE.Vector3(0, 0, 0);
    let cameraShake = 0;
    let cameraFovVelocity = 0;

    // Analytics
    let analytics = { smashes: 0, shards: 0, maxSpeed: 0, maxForce: 0 };

    // Environment dimensions
    const ARENA = {
      wallZ: -12.5, floorY: -2.6, sideX: 11.0, ceilY: 10.0,
      readyPos: new THREE.Vector3(0.55, -1.35, 1.1)
    };

    // VR: プレイヤーを床の上に立たせる（以前は床の4m上に浮いていた）
    const VR_RIG_POS = new THREE.Vector3(0, ARENA.floorY, 3.2);
    // VR投擲チューニング
    const VR_THROW = {
      sampleWindow: 0.09,       // 速度推定に使う直近の時間 (秒)
      historyLength: 0.25,
      minSwingSpeed: 1.2,       // これ以上の手の速さで「振っている」と判定 (m/s)
      minForward: 0.5,          // 壁方向(-Z)への最低速度
      minAutoReleasePeak: 1.5,  // 自動リリースに必要な最高速度
      peakDropRatio: 0.8,       // 最高速の80%まで落ちた瞬間（振り切り）でリリース
      speedGain: 1.75,          // 実際の手の速さ → ゲーム内の球速
      minLaunchSpeed: 7.0,
      maxLaunchSpeed: 24.0,
      aimAssist: 0.6,           // 0=純物理 / 1=狙った点に必ず届く
      towerMagnet: 0.7,         // タワー付近を狙ったときの吸い寄せ
      towerMagnetRadius: 2.4,
      gravity: -11.0,           // VRで投げた鉢の重力（ふわっと自然な放物線）
      rearmSpeed: 0.9,          // 手がこの速さ以下に落ち着いたら次の鉢を出す
      cooldown: 0.3,
      gripClosed: 1.45, gripOpen: 1.75
    };

    // Interaction handling for Browser
    let activePointerId = null;
    let isPointerDown = false;
    let pointerDownPos = { x: 0, y: 0, time: 0 };
    let dragCurrent = { x: 0, y: 0, time: 0 };
    let dragHistory = [];
    let lastThrowTime = 0;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playAuthenticImpactAudio(intensity = 1.0) {
      if (!audioEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const safeInt = Math.min(Math.max(intensity, 0.5), 2.8);

      const subOsc = ctx.createOscillator();
      const subGain = ctx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(125, now);
      subOsc.frequency.exponentialRampToValueAtTime(32, now + 0.22);
      subGain.gain.setValueAtTime(1.0 * safeInt, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      subOsc.connect(subGain);
      subGain.connect(ctx.destination);
      subOsc.start(now);
      subOsc.stop(now + 0.3);

      const clatterCount = 5;
      for (let i = 0; i < clatterCount; i++) {
        const delay = 0.03 + i * 0.045 + Math.random() * 0.03;
        setTimeout(() => {
          if (!audioEnabled || !audioCtx) return;
          const clinkOsc = ctx.createOscillator();
          const clinkGain = ctx.createGain();
          clinkOsc.frequency.setValueAtTime(3600 + Math.random() * 3200, ctx.currentTime);
          clinkGain.gain.setValueAtTime(0.14 * safeInt, ctx.currentTime);
          clinkGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
          clinkOsc.connect(clinkGain);
          clinkGain.connect(ctx.destination);
          clinkOsc.start();
          clinkOsc.stop(ctx.currentTime + 0.08);
        }, delay * 1000);
      }
    }

    function playExplosionAudio() {
      if (!audioEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const boomOsc = ctx.createOscillator();
      const boomGain = ctx.createGain();
      boomOsc.type = 'sine';
      boomOsc.frequency.setValueAtTime(160, now);
      boomOsc.frequency.exponentialRampToValueAtTime(24, now + 0.55);
      boomGain.gain.setValueAtTime(1.8, now);

      boomGain.connect(ctx.destination);

    function playCrystalShatterAudio() {
      if (!audioEnabled) return;

      const now = ctx.currentTime;
      const freqs = [4200, 5600, 7200, 9400, 11500];
      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq + Math.random() * 200, now);
        const decay = 0.25 + idx * 0.08;
        g.gain.setValueAtTime(0.35 / (idx + 1), now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + decay);
      });
    }

    function playThrowWhooshAudio(power = 1.0) {
      if (!audioEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const dur = 0.32;
      const bufLen = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufLen) * Math.PI);
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(280, now);
      filter.frequency.linearRampToValueAtTime(1550 * Math.max(power, 0.8), now + 0.12);
      filter.frequency.exponentialRampToValueAtTime(200, now + dur);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.6 * Math.min(power, 2.0), now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
    }

    function createProceduralCanvas(w, h, drawFn) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      drawFn(ctx, w, h);
      return c;
    }

    function generateWallTexture() {
      const canvas = createProceduralCanvas(1024, 1024, (ctx, w, h) => {
        ctx.fillStyle = '#1e2126'; ctx.fillRect(0, 0, w, h);
        const rows = 18, cols = 9, rH = h / rows, cW = w / cols;
        for (let r = 0; r < rows; r++) {
          const off = (r % 2) * (cW * 0.5);
          for (let c = -1; c < cols + 1; c++) {
            const bx = c * cW + off, by = r * rH;
            const lum = 32 + Math.floor(Math.random() * 24);
            ctx.fillStyle = `hsl(215, 10%, ${lum}%)`;
            ctx.fillRect(bx + 3, by + 3, cW - 6, rH - 6);
            for (let s = 0; s < 45; s++) {
              ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.18)';
              ctx.fillRect(bx + 4 + Math.random() * (cW - 8), by + 4 + Math.random() * (rH - 8), 2.5, 2.5);
            }
          }
        }
        ctx.strokeStyle = '#0e1014'; ctx.lineWidth = 4;
        for (let r = 0; r <= rows; r++) {
          ctx.beginPath(); ctx.moveTo(0, r * rH); ctx.lineTo(w, r * rH); ctx.stroke();
        }
      });
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 2);
      return tex;
    }

    function generateFloorTexture() {
      const canvas = createProceduralCanvas(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#14161a'; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 6000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.1)';

    function generateClayTexture() {
      const canvas = createProceduralCanvas(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#c05335'; ctx.fillRect(0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 40;
          img.data[i] = Math.min(255, Math.max(0, img.data[i] + n));
          img.data[i+1] = Math.min(255, Math.max(0, img.data[i+1] + n * 0.7));
          img.data[i+2] = Math.min(255, Math.max(0, img.data[i+2] + n * 0.4));
        }
        ctx.putImageData(img, 0, 0);
      });
      return new THREE.CanvasTexture(canvas);
    }

    function generateCrateTexture() {
      const canvas = createProceduralCanvas(256, 256, (ctx, w, h) => {
        ctx.fillStyle = '#9c6634'; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(70, 40, 15, 0.45)'; ctx.lineWidth = 2;
        for (let y = 32; y < h; y += 32) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
        ctx.strokeStyle = '#5a3517'; ctx.lineWidth = 14; ctx.strokeRect(7, 7, w - 14, h - 14);
        ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(12, 12); ctx.lineTo(w - 12, h - 12);
        ctx.moveTo(w - 12, 12); ctx.lineTo(12, h - 12); ctx.stroke();
        ctx.fillStyle = '#2a1a0d';
        [[16, 16], [w - 16, 16], [16, h - 16], [w - 16, h - 16]].forEach(([sx, sy]) => {
          ctx.beginPath(); ctx.arc(sx, sy, 4.5, 0, Math.PI * 2); ctx.fill();

    function generateMagmaTexture() {
      const canvas = createProceduralCanvas(512, 512, (ctx, w, h) => {

    function spawnShockwave(pos, normal = new THREE.Vector3(0, 0, 1), color = 0xffa336, maxR = 7.0) {

    function buildPyramidTower() {
      towerBlocks.forEach(b => scene.remove(b.mesh)); towerBlocks = [];
      if (!crateTexture) crateTexture = generateCrateTexture();
      const crateMat = new THREE.MeshStandardMaterial({ map: crateTexture, roughness: 0.75, metalness: 0.15 });
      const bW = 0.95, bH = 0.65, bD = 0.95, baseZ = -9.8, startY = ARENA.floorY + bH * 0.5, levels = 5;

      for (let lvl = 0; lvl < levels; lvl++) {
        const countInRow = levels - lvl, startX = -(countInRow * bW) / 2 + bW / 2, yPos = startY + lvl * bH;
        for (let c = 0; c < countInRow; c++) {
          const blockMesh = new THREE.Mesh(new THREE.BoxGeometry(bW, bH, bD), crateMat);
          blockMesh.position.set(startX + c * bW, yPos, baseZ);
          blockMesh.castShadow = true; blockMesh.receiveShadow = true; scene.add(blockMesh);
          towerBlocks.push({
            mesh: blockMesh, size: new THREE.Vector3(bW, bH, bD), radius: Math.hypot(bW, bH, bD) * 0.5,
            initialPos: new THREE.Vector3(startX + c * bW, yPos, baseZ), vel: new THREE.Vector3(0, 0, 0),
            angVel: new THREE.Vector3(0, 0, 0), isHit: false, isResting: false
          });
        }
      }
    }

    function getHandednessFromHand(hand) {
      const inputSources = renderer.xr.getSession()?.inputSources || [];
      for (const source of inputSources) {
        if (source.hand) {
          // The Hand object itself does not expose handedness consistently across
          // browser versions, so match the XR input source to its hand reference.
          if (source.hand === hand.joints || source.hand === hand) return source.handedness;
        }
      }
      return null;
    }

    function findXRHandBySide(side) {
      const session = renderer.xr.getSession();
      if (!session) return null;
      for (const source of session.inputSources) {
        if (source.hand && source.handedness === side) {
          if (hand1 && hand1.joints && hand1.joints.wrist && hand1.joints.wrist.jointSpace === source.hand.get('wrist')) return hand1;
          if (hand2 && hand2.joints && hand2.joints.wrist && hand2.joints.wrist.jointSpace === source.hand.get('wrist')) return hand2;
        }
      }
      // Fallback: inspect the joint groups themselves.
      const candidates = [hand1, hand2].filter(h => h && h.joints && h.joints.wrist);
      return candidates.length === 1 ? candidates[0] : null;
    }

    function getPalmPose(hand) {
      if (!hand || !hand.joints) return null;
      const j = hand.joints;
      const wrist = j['wrist'];
      const indexMcp = j['index-finger-metacarpal'];
      const middleMcp = j['middle-finger-metacarpal'];
      const ringMcp = j['ring-finger-metacarpal'];
      const pinkyMcp = j['pinky-finger-metacarpal'];
      if (!wrist || !indexMcp || !middleMcp || !ringMcp || !pinkyMcp) return null;

      const p = new THREE.Vector3();
      const pi = new THREE.Vector3();
      const pm = new THREE.Vector3();
      const pr = new THREE.Vector3();
      const pp = new THREE.Vector3();
      wrist.getWorldPosition(p);
      indexMcp.getWorldPosition(pi);
      middleMcp.getWorldPosition(pm);
      ringMcp.getWorldPosition(pr);
      pinkyMcp.getWorldPosition(pp);

      // Palm center: slightly toward the fingers from the wrist.
      const palm = pi.clone().add(pm).add(pr).add(pp).multiplyScalar(0.25);
      palm.lerp(p, 0.28);

      // Finger direction is used only for orienting the held pot, not for throw speed.
      const fingerDir = pm.clone().sub(p).normalize();
      const across = pp.clone().sub(pi).normalize();
      const palmNormal = new THREE.Vector3().crossVectors(across, fingerDir).normalize();

      // Stable hand orientation: X = across fingers, Y = toward fingers,
      // Z = palm normal. This avoids relying on controller grip orientation.
      const basis = new THREE.Matrix4();
      const xAxis = across.clone().normalize();
      const yAxis = fingerDir.clone().normalize();
      const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
      const correctedY = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();
      basis.makeBasis(xAxis, correctedY, zAxis);
      const quat = new THREE.Quaternion().setFromRotationMatrix(basis);

      return { position: palm, quaternion: quat, normal: palmNormal };
    }

    function getNativePalmPose(inputSource, frame, referenceSpace) {
      if (!inputSource || !inputSource.hand || !frame || !referenceSpace) return null;
      const names = ['wrist', 'index-finger-metacarpal', 'middle-finger-metacarpal', 'ring-finger-metacarpal', 'pinky-finger-metacarpal'];
      const poses = {};
      for (const name of names) {
        const space = inputSource.hand.get(name);
        if (!space) return null;
        const pose = frame.getJointPose(space, referenceSpace);
        if (!pose) return null;
        poses[name] = pose;
      }

      const point = name => new THREE.Vector3(
        poses[name].transform.position.x,
        poses[name].transform.position.y,
        poses[name].transform.position.z
      );
      const wrist = point('wrist');
      const index = point('index-finger-metacarpal');
      const middle = point('middle-finger-metacarpal');
      const ring = point('ring-finger-metacarpal');
      const pinky = point('pinky-finger-metacarpal');
      const palm = index.clone().add(middle).add(ring).add(pinky).multiplyScalar(0.25).lerp(wrist, 0.28);

      const q = poses.wrist.transform.orientation;
      const quaternion = new THREE.Quaternion(q.x, q.y, q.z, q.w);
      return { position: palm, quaternion };
    }

    // =====================================================================
    //  自然な投擲システム (VR)
    //  - 手の位置を時系列で記録し、最小二乗法で「本当の手の速度」を推定
    //  - 腕を振り始めたら速度のピークを記録し、振り切った瞬間（フォロースルー）
    //    または手を開いた瞬間にリリース → ピーク時の速度・方向で飛ぶ
    //  - 手を振った方向の延長線上（壁 or タワー）に届くよう、ゆるくエイム補正
    //  - 投げた後は手が落ち着くまで次の鉢を出さない（同じ振りで二重投げしない）
    // =====================================================================
    function createThrowTracker() {
      return {
        samples: [], swinging: false, peakSpeed: 0, idleTime: 0,
        peakVel: new THREE.Vector3(), peakAngVel: new THREE.Vector3(),
        wasClosed: false, waitingRearm: false
      };
    }
    const throwTrackers = { hand: createThrowTracker(), controller: createThrowTracker() };
    const _tmpV = new THREE.Vector3(), _velV = new THREE.Vector3(), _angV = new THREE.Vector3();
    const _offV = new THREE.Vector3(), _rigQ = new THREE.Quaternion();
    const _spinQ = new THREE.Quaternion(), _spinAxis = new THREE.Vector3();
    const CONTROLLER_HOLD_OFFSET = new THREE.Vector3(0, -0.08, -0.13);

    function trackerPush(tr, pos, quat, t) {
      const last = tr.samples[tr.samples.length - 1];
      if (last && (last.t === t || last.p.distanceToSquared(pos) < 1e-12)) return; // 重複ポーズ（追跡更新待ち）を除外
      tr.samples.push({ p: pos.clone(), q: quat.clone(), t });
      while (tr.samples.length > 3 && t - tr.samples[0].t > VR_THROW.historyLength) tr.samples.shift();
    }

    // 直近 sampleWindow 秒の位置に直線をフィットさせ、その傾きを速度とする（ジッターに強い）
    function trackerVelocity(tr, now, out) {
      out.set(0, 0, 0);
      const s = tr.samples;
      if (s.length < 3 || now - s[s.length - 1].t > 0.12) return out;
      let start = s.length - 1;
      while (start > 0 && now - s[start - 1].t <= VR_THROW.sampleWindow) start--;
      start = Math.max(0, Math.min(start, s.length - 3));
      const n = s.length - start;
      let tm = 0; const pm = new THREE.Vector3();
      for (let i = start; i < s.length; i++) { tm += s[i].t; pm.add(s[i].p); }
      tm /= n; pm.divideScalar(n);
      let den = 0;
      for (let i = start; i < s.length; i++) {
        const dt = s[i].t - tm; den += dt * dt;
        out.addScaledVector(_tmpV.copy(s[i].p).sub(pm), dt);
      }
      if (den > 1e-8) out.divideScalar(den); else out.set(0, 0, 0);
      return out;
    }

    // 手首の回転速度（投げた鉢のスピンに反映）
    function trackerAngularVelocity(tr, out) {
      out.set(0, 0, 0);
      const s = tr.samples; if (s.length < 2) return out;
      const a = s[Math.max(0, s.length - 4)], b = s[s.length - 1];
      const dt = b.t - a.t; if (dt <= 1e-4) return out;
      const dq = b.q.clone().multiply(a.q.clone().invert());
      if (dq.w < 0) { dq.x = -dq.x; dq.y = -dq.y; dq.z = -dq.z; dq.w = -dq.w; }
      const sinHalf = Math.sqrt(Math.max(0, 1 - dq.w * dq.w));
      if (sinHalf < 1e-4) return out;
      const angle = 2 * Math.acos(Math.min(1, dq.w));
      out.set(dq.x / sinHalf, dq.y / sinHalf, dq.z / sinHalf).multiplyScalar(Math.min(angle / dt, 30));
      return out;
    }

    // 指先〜手首距離 / 指の付け根〜手首距離。握ると小さく、開くと大きくなる
    function getGripRatio(inputSource, frame, refSpace) {
      const get = n => { const sp = inputSource.hand.get(n); return sp ? frame.getJointPose(sp, refSpace) : null; };
      const w = get('wrist'), k = get('middle-finger-phalanx-proximal');
      const tips = ['index-finger-tip', 'middle-finger-tip', 'ring-finger-tip'].map(get);
      if (!w || !k || tips.some(t => !t)) return null;
      const wp = w.transform.position;
      const d = p => Math.hypot(p.x - wp.x, p.y - wp.y, p.z - wp.z);
      const knuckle = d(k.transform.position);
      if (knuckle < 1e-3) return null;
      return tips.reduce((acc, t) => acc + d(t.transform.position), 0) / 3 / knuckle;
    }

    function getTowerAimPoint() {
      const standing = towerBlocks.filter(b => !b.isHit);
      if (!standing.length) return null;
      const c = new THREE.Vector3();
      standing.forEach(b => c.add(b.mesh.position));
      return c.divideScalar(standing.length);
    }

    // 手の速度 → 実際の発射速度（物理 + 狙った点へのゆるい補正）
    function computeAssistedThrowVelocity(origin, handVel) {
      const g = VR_THROW.gravity;
      const raw = handVel.clone().multiplyScalar(VR_THROW.speedGain);
      const speed = THREE.MathUtils.clamp(raw.length(), VR_THROW.minLaunchSpeed, VR_THROW.maxLaunchSpeed);
      const dir = raw.normalize();
      if (dir.z > -0.25) { dir.z = -0.25; dir.normalize(); } // 必ず壁側へ

      // 手を振った方向へ直線を伸ばし、壁との交点を「狙った点」とする
      const t = (ARENA.wallZ + 0.5 - origin.z) / dir.z;
      const target = origin.clone().addScaledVector(dir, t);
      target.x = THREE.MathUtils.clamp(target.x, -ARENA.sideX + 1.0, ARENA.sideX - 1.0);
      target.y = THREE.MathUtils.clamp(target.y, ARENA.floorY + 0.5, ARENA.ceilY - 0.5);

      // タワーの近くを狙っていたら少し吸い寄せる
      const tower = getTowerAimPoint();
      if (tower) {
        const toTower = tower.clone().sub(origin);
        const along = toTower.dot(dir);
        if (along > 0) {
          const miss = origin.clone().addScaledVector(dir, along).distanceTo(tower);
          if (miss < VR_THROW.towerMagnetRadius) target.lerp(tower, VR_THROW.towerMagnet * (1 - miss / VR_THROW.towerMagnetRadius));
        }
      }

      // 投げた速さから飛行時間を決め、その時間で狙った点に届く放物線を計算
      const T = THREE.MathUtils.clamp(target.distanceTo(origin) / speed, 0.35, 1.8);
      const ballistic = target.clone().sub(origin).divideScalar(T);
      ballistic.y -= 0.5 * g * T;
      const physical = dir.clone().multiplyScalar(speed);
      return physical.lerp(ballistic, VR_THROW.aimAssist);
    }

    function pulseHaptics(inputSource, intensity = 0.7, ms = 45) {
      try {
        const act = inputSource && inputSource.gamepad && inputSource.gamepad.hapticActuators && inputSource.gamepad.hapticActuators[0];
        if (act && act.pulse) act.pulse(intensity, ms);
      } catch (e) {}
    }

    function releaseHeldPot(tr, handVel, handAngVel, inputSource) {
      if (!readyPot || !readyPot.mesh) return;
      const origin = readyPot.mesh.position.clone();
      const launchVel = computeAssistedThrowVelocity(origin, handVel);
      // スピン: 投球らしいバックスピン + 手首のひねり
      const fwd = launchVel.clone().normalize();
      const spinAxis = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
      if (spinAxis.lengthSq() < 1e-4) spinAxis.set(1, 0, 0);
      const spin = spinAxis.normalize().multiplyScalar(3 + launchVel.length() * 0.25).addScaledVector(handAngVel, 0.5);
      launchPotWithPhysics(origin, launchVel, spin);
      tr.swinging = false; tr.peakSpeed = 0; tr.idleTime = 0; tr.waitingRearm = true;
      vrThrowCooldown = VR_THROW.cooldown;
      pulseHaptics(inputSource, 0.8, 50);
    }

    // 手（またはコントローラー）に鉢を持たせ、投げ動作を判定する共通処理
    function updateHeldPotAndThrow(tr, pose, now, dt, opts) {
      trackerPush(tr, pose.position, pose.quaternion, now);
      const vel = trackerVelocity(tr, now, _velV);
      const angVel = trackerAngularVelocity(tr, _angV);
      const speed = vel.length();

      if (vrThrowCooldown > 0) return;
      if (tr.waitingRearm) {
        if (speed > VR_THROW.rearmSpeed) return;   // まだ腕を振っている最中
        tr.waitingRearm = false;
      }

      if (!readyPot || !readyPot.mesh) spawnReadyPot();
      if (!readyPot || !readyPot.mesh) return;

      // 手の中に鉢を保持（新しい鉢はふわっと現れる）
      readyPot.spawnProgress = Math.min(1, (readyPot.spawnProgress || 0) + dt * 6);
      const grow = 1 - Math.pow(1 - readyPot.spawnProgress, 3);
      readyPot.mesh.scale.setScalar(Math.max(0.001, VR_HAND_POT_SCALE * grow));
      readyPot.mesh.position.copy(pose.position).add(_offV.copy(opts.holdOffset).applyQuaternion(pose.quaternion));
      readyPot.mesh.quaternion.copy(pose.quaternion);
      if (readyPot.spawnProgress < 0.6) return;

      // 手の開閉（ハンドトラッキング時）
      let opened = false;
      if (opts.gripRatio != null) {
        if (opts.gripRatio < VR_THROW.gripClosed) tr.wasClosed = true;
        else if (opts.gripRatio > VR_THROW.gripOpen && tr.wasClosed) { opened = true; tr.wasClosed = false; }
      }

      const forward = -vel.z;
      const isSwing = speed > VR_THROW.minSwingSpeed && forward > VR_THROW.minForward;
      if (isSwing) {
        if (!tr.swinging) { tr.swinging = true; tr.peakSpeed = 0; }
        tr.idleTime = 0;
        if (speed > tr.peakSpeed) { tr.peakSpeed = speed; tr.peakVel.copy(vel); tr.peakAngVel.copy(angVel); }
      }
      if (!tr.swinging) return;

      let release = false;
      if (opts.buttonHeld) release = false;                         // ボタンを握っている間は離すまで持ち続ける
      else if (opened || opts.buttonReleased) release = true;       // 手を開いた / ボタンを離した瞬間
      else if (tr.peakSpeed > VR_THROW.minAutoReleasePeak && speed < tr.peakSpeed * VR_THROW.peakDropRatio) release = true; // 振り切った瞬間

      if (release) { releaseHeldPot(tr, tr.peakVel.clone(), tr.peakAngVel.clone(), opts.inputSource); return; }

      if (!isSwing) {
        tr.idleTime += dt;
        if (tr.idleTime > 0.3) { tr.swinging = false; tr.peakSpeed = 0; tr.idleTime = 0; }
      }
    }

    function updateVRControllers(dt, frame, nowMs) {
      if (!renderer.xr.isPresenting) return;
      if (vrThrowCooldown > 0) vrThrowCooldown -= dt;
      const now = nowMs / 1000;
      cameraGroup.updateMatrixWorld(true);

      // ハンドトラッキング優先（右手 → いなければ左手）
      const session = renderer.xr.getSession();
      if (session && frame) {
        const sources = Array.from(session.inputSources);
        const handSource = sources.find(s => s.hand && s.handedness === 'right') || sources.find(s => s.hand);
        if (handSource) {
          vrHandMode = true;
          const refSpace = renderer.xr.getReferenceSpace();
          const pose = getNativePalmPose(handSource, frame, refSpace);
          if (!pose) { throwTrackers.hand.samples.length = 0; return; }
          // リファレンス空間 → ワールド座標（プレイヤーの立ち位置を反映）
          pose.position.applyMatrix4(cameraGroup.matrixWorld);
          pose.quaternion.premultiply(cameraGroup.getWorldQuaternion(_rigQ));
          updateHeldPotAndThrow(throwTrackers.hand, pose, now, dt, {
            holdOffset: VR_HAND_HOLD_OFFSET,
            gripRatio: getGripRatio(handSource, frame, refSpace),
            inputSource: null
          });
          return;
        }
      }

      // コントローラー（フォールバック）
      vrHandMode = false;
      let c = null;
      if (controller2 && controller2.userData.handedness === 'right' && controller2.visible) c = controller2;
      else if (controller1 && controller1.userData.handedness === 'right' && controller1.visible) c = controller1;
      else if (controller1 && controller1.visible) c = controller1;
      else if (controller2 && controller2.visible) c = controller2;
      if (!c) return;

      const ud = c.userData;
      const pose = {
        position: new THREE.Vector3().setFromMatrixPosition(c.matrixWorld),
        quaternion: new THREE.Quaternion().setFromRotationMatrix(c.matrixWorld)
      };
      const released = !!ud.releasedPending; ud.releasedPending = false;
      updateHeldPotAndThrow(throwTrackers.controller, pose, now, dt, {
        holdOffset: CONTROLLER_HOLD_OFFSET,
        buttonHeld: (ud.buttonsDown || 0) > 0,
        buttonReleased: released,
        inputSource: ud.inputSource
      });
    }

    function setupAimMarker() {

      const markerCanvas = createProceduralCanvas(128, 128, (ctx, w, h) => {

    function setupLighting() {
      scene.add(new THREE.AmbientLight(0xd5e3f5, 0.45));

      mainSpot.position.set(2.5, 7.5, 6); mainSpot.target.position.set(0, 0.8, -6);
