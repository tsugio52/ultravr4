    function buildPotModel(type = 'terracotta') {
      const group = new THREE.Group(); let bodyMat, scaleMult = 1.0;
      if (type === 'glazed') bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a727d, roughness: 0.12, metalness: 0.25, envMapIntensity: 1.4 });
      else if (type === 'porcelain') bodyMat = new THREE.MeshStandardMaterial({ color: 0xf2f4f8, roughness: 0.22, metalness: 0.08 });
      else if (type === 'concrete') bodyMat = new THREE.MeshStandardMaterial({ color: 0x484c54, roughness: 0.95, metalness: 0.05 });
      else if (type === 'dynamite') bodyMat = new THREE.MeshStandardMaterial({ color: 0xd91e18, roughness: 0.35, metalness: 0.2, emissive: 0x550505 });
      else if (type === 'crystal') bodyMat = new THREE.MeshStandardMaterial({ color: 0x88e7ff, roughness: 0.06, metalness: 0.1, transparent: true, opacity: 0.82 });
      else if (type === 'magma') { scaleMult = 1.55; bodyMat = new THREE.MeshStandardMaterial({ map: generateMagmaTexture(), roughness: 0.7, metalness: 0.2, emissive: 0xff3300, emissiveIntensity: 0.55 }); }
      else bodyMat = new THREE.MeshStandardMaterial({ map: generateClayTexture(), roughness: 0.85, metalness: 0.05 });

      const pts = [], potH = 1.0 * scaleMult, bR = 0.42 * scaleMult, tR = 0.62 * scaleMult, rimR = 0.68 * scaleMult;
      pts.push(new THREE.Vector2(bR * 0.8, 0.0), new THREE.Vector2(bR, 0.05), new THREE.Vector2(bR * 1.05, 0.3 * scaleMult));
      pts.push(new THREE.Vector2(tR * 0.96, potH * 0.86), new THREE.Vector2(rimR, potH * 0.92), new THREE.Vector2(rimR, potH));
      pts.push(new THREE.Vector2(rimR * 0.91, potH), new THREE.Vector2(tR * 0.85, potH * 0.86), new THREE.Vector2(bR * 0.75, 0.12 * scaleMult), new THREE.Vector2(0.12, 0.1));
      const potGeo = new THREE.LatheGeometry(pts, 36); potGeo.computeVertexNormals();
      const bodyMesh = new THREE.Mesh(potGeo, bodyMat); bodyMesh.castShadow = true; bodyMesh.receiveShadow = true; group.add(bodyMesh);

      if (type === 'dynamite') {
        const fuseCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, potH * 0.9, 0), new THREE.Vector3(0.05, potH * 1.15, 0.03), new THREE.Vector3(-0.02, potH * 1.32, 0.08)]);
        group.add(new THREE.Mesh(new THREE.TubeGeometry(fuseCurve, 10, 0.022, 6, false), new THREE.MeshBasicMaterial({ color: 0x332211 })));
        const spark = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffdd44 }));
        spark.position.set(-0.02, potH * 1.32, 0.08); group.add(spark);
      }

      const soilMat = new THREE.MeshStandardMaterial({ map: generateSoilTexture(), roughness: 0.96, metalness: 0.02 });
      const soilMesh = new THREE.Mesh(new THREE.CylinderGeometry(tR * 0.85, tR * 0.76, 0.22 * scaleMult, 28), soilMat);
      soilMesh.position.y = potH * 0.82; soilMesh.castShadow = true; group.add(soilMesh);

      const plantGroup = new THREE.Group(); plantGroup.position.y = potH * 0.86;
      let leafColor = 0x2ea048;
      if (type === 'glazed') leafColor = 0x227842; else if (type === 'porcelain') leafColor = 0x1d6332;
      else if (type === 'dynamite') leafColor = 0x772211; else if (type === 'crystal') leafColor = 0x44ddee; else if (type === 'magma') leafColor = 0xff6600;
      const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: type === 'crystal' ? 0.1 : 0.35, metalness: 0.05, side: THREE.DoubleSide });
      const leafCount = (type === 'dynamite') ? 5 : 10;
      
      for (let i = 0; i < leafCount; i++) {
        const ang = (i / leafCount) * Math.PI * 2 + Math.random() * 0.3;
        const stemCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(Math.cos(ang) * 0.04, 0, Math.sin(ang) * 0.04), new THREE.Vector3(Math.cos(ang) * 0.28, (0.38 + Math.random() * 0.2) * scaleMult, Math.sin(ang) * 0.28), new THREE.Vector3(Math.cos(ang) * 0.58, (0.54 + Math.random() * 0.25) * scaleMult, Math.sin(ang) * 0.58)]);
        const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 10, 0.028 * scaleMult, 6, false), new THREE.MeshStandardMaterial({ color: 0x1b4d24, roughness: 0.6 }));
        stem.castShadow = true; plantGroup.add(stem);
        const leafGeo = new THREE.PlaneGeometry(0.42 * scaleMult, 0.68 * scaleMult, 5, 7);
        const pos = leafGeo.attributes.position;
        for (let p = 0; p < pos.count; p++) pos.setZ(p, Math.sin((pos.getY(p) + 0.35) * 3) * 0.09 - (pos.getX(p) * pos.getX(p)) * 0.16);
        leafGeo.computeVertexNormals();
        const leafMesh = new THREE.Mesh(leafGeo, leafMat);
        leafMesh.position.copy(stemCurve.getPoint(1.0)); leafMesh.rotation.set(0.45 + Math.random() * 0.25, ang - Math.PI / 2, (Math.random() - 0.5) * 0.4);
        leafMesh.castShadow = true; plantGroup.add(leafMesh);
      }
      group.add(plantGroup); return { group, bodyMat, soilMat, leafMat, potType: type, scaleMult };
    }

    function spawnReadyPot() {
      if (readyPot && readyPot.mesh) return readyPot;
      const potData = buildPotModel(activePotType);
      readyPot = {
        mesh: potData.group, bodyMat: potData.bodyMat, soilMat: potData.soilMat, leafMat: potData.leafMat,
        potType: potData.potType, scaleMult: potData.scaleMult || 1.0,
        initialPos: new THREE.Vector3().copy(ARENA.readyPos), spawnProgress: 0
      };
      readyPot.mesh.position.copy(readyPot.initialPos);
      readyPot.mesh.rotation.set(0, Math.random() * Math.PI, 0);
      readyPot.mesh.scale.set(0.1, 0.1, 0.1);
      scene.add(readyPot.mesh);
      return readyPot;
    }

    function scheduleAutoRespawn(delayMs = 280) {
      if (autoRespawnTimeout) clearTimeout(autoRespawnTimeout);
      autoRespawnTimeout = setTimeout(() => { spawnReadyPot(); }, delayMs);
    }

    function addWallImpactDecal(x, y) {
      const decalSize = 2.4 + Math.random() * 1.2;
      const canvas = createProceduralCanvas(512, 512, (ctx, w, h) => {
        ctx.clearRect(0, 0, w, h);
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, 180);
        grad.addColorStop(0, 'rgba(10, 8, 7, 0.95)'); grad.addColorStop(0.3, 'rgba(40, 22, 14, 0.85)');
        grad.addColorStop(0.7, 'rgba(25, 18, 12, 0.4)'); grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(w/2, h/2, 180, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(8, 7, 6, 0.95)'; ctx.lineWidth = 3.5;
        const numCracks = 10 + Math.floor(Math.random() * 6);
        for (let i = 0; i < numCracks; i++) {
          let cx = w/2, cy = h/2, angle = (i / numCracks) * Math.PI * 2 + (Math.random() - 0.5) * 0.4, len = 120 + Math.random() * 110;
          ctx.beginPath(); ctx.moveTo(cx, cy);
          let step = 0;
          while (step < len) {
            step += 18 + Math.random() * 15; angle += (Math.random() - 0.5) * 0.5;
            cx += Math.cos(angle) * 20; cy += Math.sin(angle) * 20; ctx.lineTo(cx, cy);
          }
          ctx.stroke();
        }
      });
      const decalMesh = new THREE.Mesh(new THREE.PlaneGeometry(decalSize, decalSize), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.92, depthWrite: false }));
      decalMesh.position.set(x, y, ARENA.wallZ + 0.03 + (wallImpactDecals.length * 0.001));
      scene.add(decalMesh); wallImpactDecals.push(decalMesh);
      if (wallImpactDecals.length > 20) { const old = wallImpactDecals.shift(); scene.remove(old); }
    }

    function shatterPot(flyingObj) {
      const impactPos = flyingObj.mesh.position.clone(), impactVel = flyingObj.velocity.clone(), hitSpeed = impactVel.length(), pType = flyingObj.potType || 'terracotta', speedKmH = Math.round(hitSpeed * 3.6 * 4.4);
      analytics.smashes++; if (speedKmH > analytics.maxSpeed) analytics.maxSpeed = speedKmH;
      document.getElementById('stat-smashes').innerText = analytics.smashes; document.getElementById('stat-speed').innerHTML = `${analytics.maxSpeed} <span class="text-[9px]">km/h</span>`;
      scene.remove(flyingObj.mesh);

      if (pType === 'dynamite') {
        hitStopTimer = 0.08; cameraShake = 1.45; triggerFlashImpact(); playExplosionAudio();
        spawnShockwave(impactPos, new THREE.Vector3(0, 0, 1), 0xff3300, 14.0); showCrashTextPopup("💣 MEGA EXPLOSION!!");
        towerBlocks.forEach(tb => {
          const d = tb.mesh.position.distanceTo(impactPos);
          if (d < 6.5) {
            tb.isHit = true; tb.isResting = false;
            tb.vel.addScaledVector(tb.mesh.position.clone().sub(impactPos).normalize(), (6.5 - d) * 7.5); tb.vel.y += Math.random() * 4.0 + 3.0;
            tb.angVel.set((Math.random() - 0.5) * 25, (Math.random() - 0.5) * 25, (Math.random() - 0.5) * 25);
          }
        });
      } else if (pType === 'crystal') {
        hitStopTimer = 0.045; cameraShake = 0.6; triggerFlashImpact(); playCrystalShatterAudio();
        spawnShockwave(impactPos, new THREE.Vector3(0, 0, 1), 0x77eeff, 8.5); showCrashTextPopup("💎 CRYSTAL SHATTER!!");
      } else if (pType === 'magma') {
        hitStopTimer = 0.095; cameraShake = 1.8; triggerFlashImpact(); playMagmaImpactAudio();
        spawnShockwave(impactPos, new THREE.Vector3(0, 0, 1), 0xff6600, 12.0); showCrashTextPopup("🌋 VOLCANIC CRUSH!!");
        towerBlocks.forEach(tb => {
          if (tb.mesh.position.distanceTo(impactPos) < 4.2) {
            tb.isHit = true; tb.isResting = false; tb.vel.add(new THREE.Vector3((Math.random() - 0.5) * 12, Math.random() * 6 + 3, Math.random() * 8 + 4));
          }
        });
      } else {
        hitStopTimer = 0.055; cameraShake = Math.min(hitSpeed * 0.09, 0.95); triggerFlashImpact();
        playAuthenticImpactAudio(hitSpeed / 10); spawnShockwave(impactPos, new THREE.Vector3(0, 0, 1), 0xff9533, 7.5);
      }
      hideSpeedLines();
      if (impactPos.z <= ARENA.wallZ + 0.7) addWallImpactDecal(impactPos.x, impactPos.y);

      // ★ 破片や土のサイズにも鉢のスケールを乗算して反映
      const potScale = flyingObj.scaleMultiplier || 1.0; 
      const shardMultiplier = (pType === 'crystal') ? 3.0 : (pType === 'magma' ? 1.4 : 1.0);
      const baseCount = Math.floor(6 * shardMultiplier);
      
      for (let b = 0; b < baseCount; b++) {
        const baseSize = (0.28 + Math.random() * 0.18) * potScale;
        const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(baseSize, baseSize * 1.1, 0.09 * potScale, 5), flyingObj.bodyMat);
        baseMesh.castShadow = true; baseMesh.position.copy(impactPos).add(new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, 0.1));
        baseMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        const burstAngle = Math.random() * Math.PI * 2, bForce = (Math.random() * 0.6 + 0.5) * hitSpeed * (pType === 'dynamite' ? 0.9 : 0.4);
        shards.push({ mesh: baseMesh, vel: new THREE.Vector3(Math.cos(burstAngle) * bForce, Math.sin(burstAngle) * bForce * 0.7 + 1.5, Math.abs(impactVel.z) * (0.32 + Math.random() * 0.35)), angVel: new THREE.Vector3((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20), radius: baseSize * 0.8, isResting: false });
        scene.add(baseMesh);
      }

      const shardCount = Math.floor(45 * shardMultiplier); analytics.shards += shardCount;
      for (let i = 0; i < shardCount; i++) {
        const sSize = (0.12 + Math.random() * 0.2) * potScale;
        const shardMesh = new THREE.Mesh(new THREE.ConeGeometry(sSize, sSize * 1.6, 3 + Math.floor(Math.random() * 3)), flyingObj.bodyMat);
        shardMesh.castShadow = true; shardMesh.receiveShadow = true; shardMesh.position.copy(impactPos).add(new THREE.Vector3((Math.random() - 0.5) * 0.45, (Math.random() - 0.5) * 0.45, (Math.random() - 0.5) * 0.2));
        const burstAngle = Math.random() * Math.PI * 2, burstStr = (Math.random() * 0.7 + 0.4) * hitSpeed * (pType === 'dynamite' ? 1.2 : 0.6);
        shards.push({ mesh: shardMesh, vel: new THREE.Vector3(Math.cos(burstAngle) * burstStr + impactVel.x * 0.3, Math.sin(burstAngle) * burstStr * 0.75 + Math.random() * 3.2, Math.abs(impactVel.z) * (0.3 + Math.random() * 0.45)), angVel: new THREE.Vector3((Math.random() - 0.5) * 32, (Math.random() - 0.5) * 32, (Math.random() - 0.5) * 32), radius: sSize * 0.65, isResting: false });
        scene.add(shardMesh);
      }

      const rootBallMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.32 * potScale, 1), flyingObj.soilMat);
      rootBallMesh.position.copy(impactPos).add(new THREE.Vector3(0, 0, 0.15)); rootBallMesh.castShadow = true;
      rootBallDebris.push({ mesh: rootBallMesh, vel: new THREE.Vector3(impactVel.x * 0.2, 1.8, Math.abs(impactVel.z) * 0.22), angVel: new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 0), isResting: false });
      scene.add(rootBallMesh);

      for (let s = 0; s < 80; s++) {
        const soilMesh = new THREE.Mesh(new THREE.DodecahedronGeometry((0.045 + Math.random() * 0.065) * potScale, 0), flyingObj.soilMat);
        soilMesh.castShadow = true; soilMesh.position.copy(impactPos).add(new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.3));
        const ang = Math.random() * Math.PI * 2, force = (Math.random() * 0.7 + 0.3) * hitSpeed * (pType === 'dynamite' ? 0.9 : 0.45);
        soilParticles.push({ mesh: soilMesh, vel: new THREE.Vector3(Math.cos(ang) * force, Math.sin(ang) * force * 0.8 + Math.random() * 2.5, Math.abs(impactVel.z) * (0.2 + Math.random() * 0.3)), angVel: new THREE.Vector3((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, 0), isResting: false });
        scene.add(soilMesh);
      }

      for (let f = 0; f < 9; f++) {
        const leafMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.32 * potScale, 0.5 * potScale), flyingObj.leafMat);
        leafMesh.position.copy(impactPos).add(new THREE.Vector3((Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.6, 0.1)); leafMesh.castShadow = true;
        foliagePieces.push({ mesh: leafMesh, vel: new THREE.Vector3((Math.random() - 0.5) * 5, Math.random() * 3 + 1.2, Math.abs(impactVel.z) * 0.25 + Math.random() * 2), angVel: new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14), flutter: Math.random() * Math.PI * 2 });
        scene.add(leafMesh);
      }
      spawnDustExplosion(impactPos, potScale);
    }

    function spawnDustExplosion(pos, potScale = 1.0) {
      const dustGeo = new THREE.PlaneGeometry(1.1 * potScale, 1.1 * potScale), dustMat = new THREE.MeshBasicMaterial({ color: activePotType === 'glazed' ? 0x82c8ce : (activePotType === 'porcelain' ? 0xe5eaf2 : 0xd29882), transparent: true, opacity: 0.55, depthWrite: false });
      for (let d = 0; d < 20; d++) {
        const dust = new THREE.Mesh(dustGeo, dustMat.clone());
        dust.position.copy(pos).add(new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.25));
        dust.rotation.z = Math.random() * Math.PI * 2;
        dustClouds.push({ mesh: dust, vel: new THREE.Vector3((Math.random() - 0.5) * 2.8, (Math.random() * 2.0 + 0.4), Math.random() * 2.5), scaleRate: (2.0 + Math.random() * 2.0) * potScale, opacity: 0.65 });
        scene.add(dust);
      }
    }

    function emitPotTrail(pos) {
      const trailMesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffa055, transparent: true, opacity: 0.35, depthWrite: false }));
      trailMesh.position.copy(pos).add(new THREE.Vector3((Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2));
      scene.add(trailMesh); potTrails.push({ mesh: trailMesh, opacity: 0.35, scale: 1.0 });
    }

    function triggerFlashImpact() { const f = document.getElementById('flash-overlay'); f.style.opacity = '0.45'; setTimeout(() => f.style.opacity = '0', 70); }
    function showSpeedLines() { if (!speedLinesActive) { speedLinesActive = true; document.getElementById('speed-overlay').style.opacity = '1'; } }
    function hideSpeedLines() { speedLinesActive = false; document.getElementById('speed-overlay').style.opacity = '0'; }

    const GRAVITY = -15.5, FLOOR_RESTITUTION = 0.28, WALL_RESTITUTION = 0.38, FRICTION = 0.88;

    function stepPhysics(delta) {
      if (hitStopTimer > 0) { hitStopTimer -= delta; updateCameraMotion(delta * 0.5); return; }
      const effDt = Math.min(delta, 0.05) * timeScale;

      if (readyPot && readyPot.mesh && readyPot.spawnProgress < 1.0 && (!renderer.xr.isPresenting)) {
        readyPot.spawnProgress = Math.min(1.0, readyPot.spawnProgress + effDt * 7.0);
        const s = Math.sin(readyPot.spawnProgress * Math.PI * 0.5); readyPot.mesh.scale.set(s, s, s);
      }

      for (let p = flyingPots.length - 1; p >= 0; p--) {
        const fp = flyingPots[p];
        fp.velocity.y += (fp.gravity !== undefined ? fp.gravity : GRAVITY) * effDt; fp.mesh.position.addScaledVector(fp.velocity, effDt);
        if (fp.spin) {
          const w = fp.spin.length();
          if (w > 1e-4) { _spinQ.setFromAxisAngle(_spinAxis.copy(fp.spin).divideScalar(w), w * effDt); fp.mesh.quaternion.premultiply(_spinQ); }
        } else {
          fp.mesh.rotation.x += fp.angularVel.x * effDt; fp.mesh.rotation.y += fp.angularVel.y * effDt; fp.mesh.rotation.z += fp.angularVel.z * effDt;
        }
        if (fp.mesh.position.z > 14) { scene.remove(fp.mesh); flyingPots.splice(p, 1); continue; }

        fp.trailTimer = (fp.trailTimer || 0) + effDt;
        if (fp.trailTimer > 0.02) { fp.trailTimer = 0; emitPotTrail(fp.mesh.position); }

        let hitTower = false;
        for (let tb of towerBlocks) {
          if (fp.mesh.position.distanceTo(tb.mesh.position) < tb.radius + 0.45) {
            hitTower = true; tb.isHit = true; tb.isResting = false;
            const potSpeed = fp.velocity.length(), hitDir = fp.velocity.clone().normalize();
            tb.vel.copy(hitDir).multiplyScalar(potSpeed * 0.75).add(new THREE.Vector3(0, 3.5, 0));
            tb.angVel.set((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16);
            for (let other of towerBlocks) {
              if (other === tb) continue;
              const d = tb.mesh.position.distanceTo(other.mesh.position);
              if (d < 2.5) {
                other.isHit = true; other.isResting = false;
                other.vel.addScaledVector(other.mesh.position.clone().sub(tb.mesh.position).normalize(), (2.5 - d) * 4.5);
                other.vel.y += Math.random() * 2.5 + 1.2; other.angVel.add(new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8));
              }
            }
            playBlockCrashAudio(potSpeed / 12.0); showCrashTextPopup("💥 TOWER CRASH!!"); shatterPot(fp); flyingPots.splice(p, 1); break;
          }
        }
        if (hitTower) continue;
        if (fp.mesh.position.z <= ARENA.wallZ + 0.5 || fp.mesh.position.y <= ARENA.floorY + 0.48 * (fp.scaleMultiplier || 1) || Math.abs(fp.mesh.position.x) >= ARENA.sideX) {
          shatterPot(fp); flyingPots.splice(p, 1);
        }
      }

      for (let tr = potTrails.length - 1; tr >= 0; tr--) {
        const t = potTrails[tr]; t.opacity -= 1.8 * effDt; t.scale += 2.0 * effDt;
        t.mesh.scale.set(t.scale, t.scale, t.scale); t.mesh.material.opacity = Math.max(0, t.opacity);
        if (t.opacity <= 0) { scene.remove(t.mesh); potTrails.splice(tr, 1); }
      }

      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i]; if (s.isResting) continue;
        s.vel.y += GRAVITY * effDt; s.mesh.position.addScaledVector(s.vel, effDt);
        s.mesh.rotation.x += s.angVel.x * effDt; s.mesh.rotation.y += s.angVel.y * effDt; s.mesh.rotation.z += s.angVel.z * effDt;
        if (s.mesh.position.y <= ARENA.floorY + s.radius) {
          s.mesh.position.y = ARENA.floorY + s.radius; s.vel.y = -s.vel.y * FLOOR_RESTITUTION;
          s.vel.x *= FRICTION; s.vel.z *= FRICTION; s.angVel.multiplyScalar(0.72);
          if (s.vel.lengthSq() < 0.15) s.isResting = true;
        }
        if (s.mesh.position.z <= ARENA.wallZ + s.radius) { s.mesh.position.z = ARENA.wallZ + s.radius; s.vel.z = Math.abs(s.vel.z) * WALL_RESTITUTION; }
      }

      for (let s of soilParticles) {
        if (s.isResting) continue; s.vel.y += (GRAVITY * 1.3) * effDt; s.mesh.position.addScaledVector(s.vel, effDt);
        if (s.mesh.position.y <= ARENA.floorY + 0.05) { s.mesh.position.y = ARENA.floorY + 0.05; s.vel.y = -s.vel.y * 0.1; s.vel.x *= 0.6; s.vel.z *= 0.6; if (s.vel.lengthSq() < 0.1) s.isResting = true; }
      }

      for (let rb of rootBallDebris) {
        if (rb.isResting) continue; rb.vel.y += GRAVITY * effDt; rb.mesh.position.addScaledVector(rb.vel, effDt);
        if (rb.mesh.position.y <= ARENA.floorY + 0.3) { rb.mesh.position.y = ARENA.floorY + 0.3; rb.vel.y = -rb.vel.y * 0.18; rb.vel.multiplyScalar(0.75); if (rb.vel.lengthSq() < 0.1) rb.isResting = true; }
      }

      for (let l of foliagePieces) {
        l.flutter += effDt * 9; l.vel.y += (GRAVITY * 0.28) * effDt; l.vel.x += Math.sin(l.flutter) * 0.6 * effDt;
        l.mesh.position.addScaledVector(l.vel, effDt); l.mesh.rotation.x += Math.sin(l.flutter) * 2 * effDt; l.mesh.rotation.z += l.angVel.z * effDt;
        if (l.mesh.position.y <= ARENA.floorY + 0.02) { l.mesh.position.y = ARENA.floorY + 0.02; l.mesh.rotation.x = -Math.PI / 2; l.vel.set(0, 0, 0); }
      }

      for (let d = dustClouds.length - 1; d >= 0; d--) {
        const dust = dustClouds[d]; dust.mesh.position.addScaledVector(dust.vel, effDt); dust.mesh.scale.addScalar(dust.scaleRate * effDt);
        dust.opacity -= 0.68 * effDt; dust.mesh.material.opacity = Math.max(0, dust.opacity);
        if (dust.opacity <= 0) { scene.remove(dust.mesh); dustClouds.splice(d, 1); }
      }

      for (let sw = shockwaves.length - 1; sw >= 0; sw--) {
        const wave = shockwaves[sw]; wave.radius += wave.expandSpeed * effDt; wave.mesh.scale.set(wave.radius, wave.radius, 1);
        wave.opacity -= 1.8 * effDt; wave.mesh.material.opacity = Math.max(0, wave.opacity);
        if (wave.opacity <= 0 || wave.radius >= wave.maxRadius) { scene.remove(wave.mesh); shockwaves.splice(sw, 1); }
      }

      for (let tb of towerBlocks) {
        if (!tb.isHit || tb.isResting) continue;
        tb.vel.y += GRAVITY * effDt; tb.mesh.position.addScaledVector(tb.vel, effDt);
        tb.mesh.rotation.x += tb.angVel.x * effDt; tb.mesh.rotation.y += tb.angVel.y * effDt; tb.mesh.rotation.z += tb.angVel.z * effDt;
        const bottomY = ARENA.floorY + tb.size.y * 0.5;
        if (tb.mesh.position.y <= bottomY) {
          tb.mesh.position.y = bottomY; tb.vel.y = -tb.vel.y * 0.32; tb.vel.x *= 0.85; tb.vel.z *= 0.85; tb.angVel.multiplyScalar(0.78);
          if (Math.abs(tb.vel.y) > 1.2) playBlockCrashAudio(0.5);
          if (tb.vel.lengthSq() < 0.12) tb.isResting = true;
        }
        if (tb.mesh.position.z <= ARENA.wallZ + tb.size.z * 0.5) { tb.mesh.position.z = ARENA.wallZ + tb.size.z * 0.5; tb.vel.z = Math.abs(tb.vel.z) * 0.4; }
        if (Math.abs(tb.mesh.position.x) >= ARENA.sideX - 0.5) tb.vel.x = -tb.vel.x * 0.4;
      }

      updateCameraMotion(effDt); updateVRUIAnimation(effDt);
    }

    function updateCameraMotion(dt) {
      if (renderer.xr.isPresenting) return; // VR時は酔い防止のためカメラを揺らさない
      if (cameraShake > 0.001) {
        cameraOffset.x = (Math.random() - 0.5) * cameraShake; cameraOffset.y = (Math.random() - 0.5) * cameraShake; cameraShake *= Math.pow(0.04, dt);
      } else { cameraOffset.set(0, 0, 0); }
      if (camera.fov > 50) {
        camera.fov += cameraFovVelocity * dt; cameraFovVelocity -= 65 * dt;
        if (camera.fov < 50) camera.fov = 50; camera.updateProjectionMatrix();
      }
      camera.position.copy(baseCameraPos).add(cameraOffset); camera.lookAt(cameraConfigs[cameraMode].target);
    }

    function updateVRUIAnimation(dt) {
       vrUI.forEach(ui => { ui.mesh.rotation.x += dt * 0.5; ui.mesh.rotation.y += dt * 1.0; });
    }

    function getWallIntersectPoint(clientX, clientY) {
      mouseNorm.x = (clientX / window.innerWidth) * 2 - 1; mouseNorm.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseNorm, camera);
      const hitPoint = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(wallAimPlane, hitPoint)) {
        hitPoint.x = Math.max(-ARENA.sideX + 1.2, Math.min(ARENA.sideX - 1.2, hitPoint.x));
        hitPoint.y = Math.max(ARENA.floorY + 0.6, Math.min(ARENA.ceilY - 0.5, hitPoint.y));
        hitPoint.z = ARENA.wallZ; return hitPoint;
      }
      return null;
    }

    function createTapRippleUI(clientX, clientY) {
      const ripple = document.createElement('div'); ripple.className = 'tap-ripple';
      ripple.style.left = `${clientX}px`; ripple.style.top = `${clientY}px`;
      document.body.appendChild(ripple); setTimeout(() => ripple.remove(), 450);
    }

    function setupInputControllers() {
      const container = document.getElementById('canvas-container'), reticleHud = document.getElementById('reticle-hud');
      const powerGauge = document.getElementById('power-gauge'), aimLine = document.getElementById('aim-line'), aimTarget = document.getElementById('aim-target');

      function onPointerStart(e) {
        if (isPointerDown && activePointerId !== null && activePointerId !== e.pointerId) return;
        activePointerId = e.pointerId; isPointerDown = true;
        if (container.setPointerCapture) try { container.setPointerCapture(e.pointerId); } catch(err) {}

        const now = performance.now(); pointerDownPos = { x: e.clientX, y: e.clientY, time: now };
        dragCurrent = { x: e.clientX, y: e.clientY, time: now }; dragHistory = [{ x: e.clientX, y: e.clientY, time: now }];

        const hit = getWallIntersectPoint(e.clientX, e.clientY);
        if (hit) { currentAimTarget.copy(hit); if (wallTargetMarker) { wallTargetMarker.position.x = hit.x; wallTargetMarker.position.y = hit.y; } }

        reticleHud.style.opacity = '1'; reticleHud.style.left = `${e.clientX - 40}px`; reticleHud.style.top = `${e.clientY - 40}px`;
        aimTarget.setAttribute('cx', e.clientX); aimTarget.setAttribute('cy', e.clientY);
        aimLine.setAttribute('x1', e.clientX); aimLine.setAttribute('y1', e.clientY); aimLine.setAttribute('x2', e.clientX); aimLine.setAttribute('y2', e.clientY);

        const guide = document.getElementById('guide-modal'); if (guide) { guide.style.opacity = '0'; setTimeout(() => guide.remove(), 400); }
      }

      function onPointerMove(e) {
        if (!isPointerDown || e.pointerId !== activePointerId) {
          const hit = getWallIntersectPoint(e.clientX, e.clientY);
          if (hit) { currentAimTarget.copy(hit); if (wallTargetMarker) { wallTargetMarker.position.x = hit.x; wallTargetMarker.position.y = hit.y; } }
          return;
        }
        const hit = getWallIntersectPoint(e.clientX, e.clientY);
        if (hit) { currentAimTarget.copy(hit); if (wallTargetMarker) { wallTargetMarker.position.x = hit.x; wallTargetMarker.position.y = hit.y; } }

        const now = performance.now(); dragCurrent = { x: e.clientX, y: e.clientY, time: now };
        dragHistory.push({ x: e.clientX, y: e.clientY, time: now }); if (dragHistory.length > 8) dragHistory.shift();
        const dx = dragCurrent.x - pointerDownPos.x, dy = dragCurrent.y - pointerDownPos.y, dist = Math.hypot(dx, dy);

        if (dist > 15) {
          powerGauge.innerText = `AIM: ${Math.round(Math.min(dist / 200, 1.0) * 100)}%`;
          reticleHud.style.left = `${e.clientX - 40}px`; reticleHud.style.top = `${e.clientY - 40}px`;
          aimLine.setAttribute('x2', e.clientX); aimLine.setAttribute('y2', e.clientY);
          if (readyPot && readyPot.mesh && !renderer.xr.isPresenting) {
            readyPot.mesh.position.x = readyPot.initialPos.x + (dx / window.innerWidth) * 1.5;
            readyPot.mesh.position.y = readyPot.initialPos.y - (dy / window.innerHeight) * 1.0;
            readyPot.mesh.rotation.z = -dx * 0.003; readyPot.mesh.rotation.x = -dy * 0.003;
          }
        }
      }

      function onPointerEnd(e) {
        if (!isPointerDown || (activePointerId !== null && e.pointerId !== activePointerId)) return;
        isPointerDown = false; const pointerId = activePointerId; activePointerId = null;
        if (container.releasePointerCapture && pointerId !== null) try { container.releasePointerCapture(pointerId); } catch(err) {}
        reticleHud.style.opacity = '0';
        aimLine.setAttribute('x1', '0'); aimLine.setAttribute('y1', '0'); aimLine.setAttribute('x2', '0'); aimLine.setAttribute('y2', '0');

        const now = performance.now(); if (now - lastThrowTime < 130) return;
        const dx = dragCurrent.x - pointerDownPos.x, dy = dragCurrent.y - pointerDownPos.y, totalDist = Math.hypot(dx, dy);
        let flickVx = 0, flickVy = 0;
        if (dragHistory.length >= 2) {
          const oldest = dragHistory[0], newest = dragHistory[dragHistory.length - 1], dt = Math.max((newest.time - oldest.time) / 1000, 0.016);
          flickVx = (newest.x - oldest.x) / dt; flickVy = (newest.y - oldest.y) / dt;
        }

        let targetPoint = currentAimTarget.clone(), flightDuration = 0.54;
        if (totalDist < 25) {
          const directHit = getWallIntersectPoint(e.clientX, e.clientY); if (directHit) targetPoint.copy(directHit);
          createTapRippleUI(e.clientX, e.clientY); flightDuration = 0.52;
        } else {
          if (dy > 30) { targetPoint.x += (-dx / window.innerWidth) * 16.0; targetPoint.y += (dy / window.innerHeight) * 8.0; }
          else { targetPoint.x += (dx / window.innerWidth) * 16.0; targetPoint.y += (-dy / window.innerHeight) * 9.0; }
          const flickSpeed = Math.hypot(flickVx, flickVy);
          if (flickSpeed > 600) flightDuration = Math.max(0.36, 0.52 - (flickSpeed / 5000) * 0.16);
          else if (totalDist > 120) flightDuration = 0.44;
        }

        targetPoint.x = Math.max(-ARENA.sideX + 1.0, Math.min(ARENA.sideX - 1.0, targetPoint.x));
        targetPoint.y = Math.max(ARENA.floorY + 0.4, Math.min(ARENA.ceilY - 0.4, targetPoint.y));
        lastThrowTime = now; launchPotToTarget(targetPoint, flightDuration);
      }

      container.addEventListener('pointerdown', onPointerStart);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerEnd);
      window.addEventListener('pointercancel', onPointerEnd);
      window.addEventListener('keydown', (e) => { if (e.code === 'Space') forceThrow(1.4); });
    }

    function launchPotToTarget(targetPoint, duration = 0.52) {
      if (isShotgunMode) {
        const spreads = [-2.4, 0, 2.4];
        spreads.forEach((spreadX, idx) => { setTimeout(() => {
          const spreadTarget = targetPoint.clone(); spreadTarget.x += spreadX; launchSinglePot(spreadTarget, duration * (0.95 + idx * 0.04));
        }, idx * 35); });
      } else launchSinglePot(targetPoint, duration);
    }

    function launchSinglePot(targetPoint, duration = 0.52) {
      let potToThrow = readyPot; if (!potToThrow || !potToThrow.mesh) potToThrow = spawnReadyPot();
      potToThrow.mesh.scale.set(1.0, 1.0, 1.0);
      const p0 = potToThrow.mesh.position.clone(), t = Math.max(0.24, duration);
      const vx = (targetPoint.x - p0.x) / t, vz = (targetPoint.z - p0.z) / t, vy = (targetPoint.y - p0.y - 0.5 * GRAVITY * t * t) / t;

      flyingPots.push({
        mesh: potToThrow.mesh, bodyMat: potToThrow.bodyMat, soilMat: potToThrow.soilMat, leafMat: potToThrow.leafMat,
        potType: potToThrow.potType || activePotType, velocity: new THREE.Vector3(vx, vy, vz),
        angularVel: new THREE.Vector3((Math.random() - 0.5) * 6 + 9, (Math.random() - 0.5) * 10, -vx * 0.35), trailTimer: 0,
        scaleMultiplier: 1.0 // ブラウザ投球では1.0倍
      });
      readyPot = null;
      if (cameraMode === 0 && !renderer.xr.isPresenting) { camera.fov = 62; cameraFovVelocity = 24; camera.updateProjectionMatrix(); }
      showSpeedLines(); playThrowWhooshAudio(Math.abs(vz) / 18.0); scheduleAutoRespawn(260);
    }

    function launchPotWithPhysics(pos, velocity, spin) {
        let potToThrow = readyPot;
        if (!potToThrow || !potToThrow.mesh) return;
        potToThrow.mesh.position.copy(pos);
        potToThrow.mesh.scale.setScalar(VR_HAND_POT_SCALE); // 手に持ったサイズのまま飛ぶ

        flyingPots.push({
            mesh: potToThrow.mesh, bodyMat: potToThrow.bodyMat, soilMat: potToThrow.soilMat, leafMat: potToThrow.leafMat,
            potType: potToThrow.potType || activePotType, velocity: velocity.clone(),
            angularVel: new THREE.Vector3(), spin: spin ? spin.clone() : new THREE.Vector3(6, 0, 0),
            gravity: VR_THROW.gravity, trailTimer: 0,
            scaleMultiplier: VR_HAND_POT_SCALE
        });
        readyPot = null; showSpeedLines(); playThrowWhooshAudio(velocity.length() / 18.0);
    }

    function toggleShotgunMode() {
      isShotgunMode = !isShotgunMode; const btn = document.getElementById('shotgun-toggle-btn'), label = document.getElementById('shotgun-label');
      if (isShotgunMode) { btn.classList.add('shotgun-active'); label.innerText = '3連:ON'; showToast('🎆 3連ショットガン射出モード ON！'); }
      else { btn.classList.remove('shotgun-active'); label.innerText = '3連:OFF'; showToast('単発投擲モードに戻りました'); }
    }

    function forceThrow(powerMultiplier = 1.4) {
      const target = currentAimTarget.clone(); target.x += (Math.random() - 0.5) * 3.5; target.y += (Math.random() - 0.5) * 2.5;
      launchPotToTarget(target, 0.44 / powerMultiplier);
    }

    function cycleCameraView() {
      cameraMode = (cameraMode + 1) % cameraConfigs.length; updateCameraPositionImmediate(); showToast(`視点: ${cameraConfigs[cameraMode].label}`);
    }

    function updateCameraPositionImmediate() {
      const cfg = cameraConfigs[cameraMode]; baseCameraPos.copy(cfg.pos);
      if (renderer && renderer.xr && renderer.xr.isPresenting) { cameraGroup.position.copy(VR_RIG_POS); } 
      else { camera.position.copy(baseCameraPos); camera.lookAt(cfg.target); }
    }

    function setPotType(type) {
      activePotType = type;
      document.querySelectorAll('.pot-type-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-gradient-to-r', 'from-orange-600', 'to-amber-600', 'text-white', 'shadow-md');
        btn.classList.add('text-slate-300');
      });
      const activeBtn = document.getElementById(`type-${type}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-300');
        activeBtn.classList.add('active', 'bg-gradient-to-r', 'from-orange-600', 'to-amber-600', 'text-white', 'shadow-md');
      }
      respawnReadyPot();
      const typeNames = { terracotta: '素焼き鉢', glazed: '瑠璃青磁鉢', porcelain: '白磁鉢', concrete: 'モルタル鉢', dynamite: '💣 爆弾鉢', crystal: '💎 水晶鉢', magma: '🌋 溶岩鉢' };
      showToast(`${typeNames[type] || type} を構えました！`);
    }

    function cyclePotType() {
        let idx = potTypesList.indexOf(activePotType); idx = (idx + 1) % potTypesList.length; setPotType(potTypesList[idx]);
    }

    function respawnReadyPot() {
      if (readyPot && readyPot.mesh) { scene.remove(readyPot.mesh); readyPot = null; }
      spawnReadyPot(); showToast('新しい植木鉢を構えました！');
    }

    function toggleSlowMo() {
      isSlowMo = !isSlowMo; timeScale = isSlowMo ? 0.18 : 1.0; const btn = document.getElementById('slowmo-btn');
      if (isSlowMo) { btn.classList.add('bg-cyan-500/25', 'border-cyan-400'); showToast('スーパースローモーション ON'); }
      else btn.classList.remove('bg-cyan-500/25', 'border-cyan-400');
    }

    function clearRoom() {
      shards.forEach(s => scene.remove(s.mesh)); soilParticles.forEach(sp => scene.remove(sp.mesh));
      rootBallDebris.forEach(rb => scene.remove(rb.mesh)); foliagePieces.forEach(f => scene.remove(f.mesh));
      wallImpactDecals.forEach(d => scene.remove(d)); potTrails.forEach(tr => scene.remove(tr.mesh)); shockwaves.forEach(sw => scene.remove(sw.mesh));
      shards = []; soilParticles = []; rootBallDebris = []; foliagePieces = []; wallImpactDecals = []; potTrails = []; shockwaves = [];
      buildPyramidTower(); showToast('破片と壁を清掃し、タワーを再構築しました！');
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled; const btn = document.getElementById('sound-btn');
      if (audioEnabled) { btn.innerHTML = '<i class="fa-solid fa-volume-high text-sm"></i>'; getAudioContext(); showToast('立体音響 ON'); }
      else { btn.innerHTML = '<i class="fa-solid fa-volume-xmark text-sm text-slate-500"></i>'; showToast('サウンド OFF'); }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-notify'); toast.innerText = msg; toast.style.opacity = '1';
      clearTimeout(toast.timer); toast.timer = setTimeout(() => toast.style.opacity = '0', 2000);
    }

    function onResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    let lastTimestamp = 0;
    function animateFrame(time, frame) {
      if (lastTimestamp === 0) lastTimestamp = time;
      const dt = (time - lastTimestamp) / 1000;
      lastTimestamp = time;

      stepPhysics(dt);
      updateVRControllers(dt, frame, time);
      renderer.render(scene, camera);
    }

    window.onload = function() {
      initScene();
      renderer.setAnimationLoop(animateFrame);
    };
  </script>
</body>
</html>
